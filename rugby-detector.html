<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rugby Ball Detector</title>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #111; color: #eee; display: flex; flex-direction: column; align-items: center; padding: 2rem; min-height: 100vh; }
    h1 { margin-bottom: 1rem; font-size: 1.5rem; }
    #drop-zone {
      width: 100%; max-width: 700px; border: 2px dashed #555; border-radius: 8px;
      padding: 2rem; text-align: center; cursor: pointer; margin-bottom: 1rem;
      transition: border-color 0.2s;
    }
    #drop-zone.drag-over { border-color: #4af; }
    #drop-zone input { display: none; }
    #status { margin-bottom: 1rem; font-size: 0.9rem; color: #aaa; }
    #canvas-container { position: relative; max-width: 700px; width: 100%; }
    canvas { width: 100%; border-radius: 8px; display: none; }
  </style>
</head>
<body>
  <h1>Rugby Ball Detector</h1>
  <div id="drop-zone">
    <p>Drop an image here or click to select</p>
    <input type="file" id="file-input" accept="image/*">
  </div>
  <div id="status">Loading model...</div>
  <div id="canvas-container">
    <canvas id="canvas"></canvas>
  </div>

  <script>
    const MODEL_URL = 'best.onnx';
    const IMG_SIZE = 640;
    const CONF_THRESHOLD = 0.05;

    let session = null;

    async function loadModel() {
      setStatus('Loading model...');
      session = await ort.InferenceSession.create(MODEL_URL, {
        executionProviders: ['wasm']
      });
      setStatus('Model ready — drop an image to detect');
    }

    function setStatus(msg) {
      document.getElementById('status').textContent = msg;
    }

    function preprocess(img) {
      const canvas = document.createElement('canvas');
      canvas.width = IMG_SIZE;
      canvas.height = IMG_SIZE;
      const ctx = canvas.getContext('2d');

      // Letterbox: scale image to fit 640x640 with padding
      const scale = Math.min(IMG_SIZE / img.width, IMG_SIZE / img.height);
      const newW = Math.round(img.width * scale);
      const newH = Math.round(img.height * scale);
      const padX = (IMG_SIZE - newW) / 2;
      const padY = (IMG_SIZE - newH) / 2;

      ctx.fillStyle = '#888';
      ctx.fillRect(0, 0, IMG_SIZE, IMG_SIZE);
      ctx.drawImage(img, padX, padY, newW, newH);

      const imageData = ctx.getImageData(0, 0, IMG_SIZE, IMG_SIZE).data;
      const tensor = new Float32Array(3 * IMG_SIZE * IMG_SIZE);

      for (let i = 0; i < IMG_SIZE * IMG_SIZE; i++) {
        tensor[i]                       = imageData[i * 4]     / 255; // R
        tensor[i + IMG_SIZE * IMG_SIZE] = imageData[i * 4 + 1] / 255; // G
        tensor[i + IMG_SIZE * IMG_SIZE * 2] = imageData[i * 4 + 2] / 255; // B
      }

      return { tensor, scale, padX, padY };
    }

    function parseOutput(output, scale, padX, padY, imgW, imgH) {
      // YOLOv8 output: [1, 5, 8400] — 5 = cx, cy, w, h, conf
      const data = output.data;
      const numBoxes = output.dims[2];
      const detections = [];

      for (let i = 0; i < numBoxes; i++) {
        const conf = data[4 * numBoxes + i];
        if (conf < CONF_THRESHOLD) continue;

        const cx = data[0 * numBoxes + i];
        const cy = data[1 * numBoxes + i];
        const w  = data[2 * numBoxes + i];
        const h  = data[3 * numBoxes + i];

        // Convert from padded 640x640 space back to original image space
        const x1 = ((cx - w / 2) - padX) / scale;
        const y1 = ((cy - h / 2) - padY) / scale;
        const x2 = ((cx + w / 2) - padX) / scale;
        const y2 = ((cy + h / 2) - padY) / scale;

        detections.push({ x1, y1, x2, y2, conf });
      }

      return nms(detections, 0.45);
    }

    function nms(detections, iouThreshold) {
      detections.sort((a, b) => b.conf - a.conf);
      const keep = [];
      const used = new Set();

      for (let i = 0; i < detections.length; i++) {
        if (used.has(i)) continue;
        keep.push(detections[i]);
        for (let j = i + 1; j < detections.length; j++) {
          if (iou(detections[i], detections[j]) > iouThreshold) used.add(j);
        }
      }
      return keep;
    }

    function iou(a, b) {
      const ix1 = Math.max(a.x1, b.x1), iy1 = Math.max(a.y1, b.y1);
      const ix2 = Math.min(a.x2, b.x2), iy2 = Math.min(a.y2, b.y2);
      const inter = Math.max(0, ix2 - ix1) * Math.max(0, iy2 - iy1);
      const areaA = (a.x2 - a.x1) * (a.y2 - a.y1);
      const areaB = (b.x2 - b.x1) * (b.y2 - b.y1);
      return inter / (areaA + areaB - inter);
    }

    async function runDetection(file) {
      if (!session) return setStatus('Model not loaded yet');

      const img = await loadImage(file);
      const canvas = document.getElementById('canvas');
      canvas.width = img.width;
      canvas.height = img.height;
      canvas.style.display = 'block';
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);

      setStatus('Running detection...');

      const { tensor, scale, padX, padY } = preprocess(img);
      const inputTensor = new ort.Tensor('float32', tensor, [1, 3, IMG_SIZE, IMG_SIZE]);
      const feeds = { [session.inputNames[0]]: inputTensor };
      const results = await session.run(feeds);
      const output = results[session.outputNames[0]];

      const detections = parseOutput(output, scale, padX, padY, img.width, img.height);

      detections.forEach(d => {
        ctx.strokeStyle = '#00ff88';
        ctx.lineWidth = 3;
        ctx.strokeRect(d.x1, d.y1, d.x2 - d.x1, d.y2 - d.y1);
        ctx.fillStyle = '#00ff88';
        ctx.font = 'bold 16px sans-serif';
        ctx.fillText(`rugby_ball ${(d.conf * 100).toFixed(0)}%`, d.x1, d.y1 - 6);
      });

      setStatus(`Detected ${detections.length} ball${detections.length !== 1 ? 's' : ''}`);
    }

    function loadImage(file) {
      return new Promise(resolve => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.src = URL.createObjectURL(file);
      });
    }

    // Events
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');

    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', e => { if (e.target.files[0]) runDetection(e.target.files[0]); });
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      if (e.dataTransfer.files[0]) runDetection(e.dataTransfer.files[0]);
    });

    loadModel();
  </script>
</body>
</html>
